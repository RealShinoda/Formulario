<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de Ayuda - Soporte Técnico</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-card">
      <h1>Mesa de Ayuda Soporte Técnico</h1>

      <form action="/guardar_registro" method="POST">
        <fieldset>
          <legend>Datos de Solicitante</legend>

          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" required />
          <label for="correo">Correo Institucional:</label>
          <input type="email" id="correo" name="correo" required />
          <label for="sede">Sede / Municipio:</label>
          <select id="sede" name="sede" required>
            <option value="">Seleccione ubicación</option>
            <option value="Mosquera">Mosquera</option>
            <option value="Madrid">Madrid</option>
            <option value="Funza">Funza</option>
            <option value="Facatativa">Facatativa</option>
            <option value="Soacha">Soacha</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Detalles del Requerimiento</legend>

          <p class="section-subtitle">Tipo de Incidencia:</p>

          <div class="radio-group">
            <label class="label-inline">
              <input type="radio" name="tiposin" value="hardware" /> Falla de
              Hardware Daño Físico
            </label>
            <label class="label-inline">
              <input type="radio" name="tiposin" value="software" checked />
              Falla de Software Actualización
            </label>
          </div>

          <div class="checkbox-group">
            <label class="label-inline">
              <input type="checkbox" name="prioridad" value="alta" /> Marcar
              como prioridad ALTA
            </label>
          </div>

          <button type="submit">Generar Ticket de Soporte</button>
        </fieldset>
      </form>
    </div>

    <h2>Tickets Recientes</h2>

    <table class="tabla1">
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Sede</th>
          <th>Tipo</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#TK-1045</td>
          <td>Mosquera</td>
          <td>Software</td>
          <td>En Revisión</td>
        </tr>
        <tr>
          <td>#TK-1046</td>
          <td>Facatativa</td>
          <td>Hardware</td>
          <td>Pendiente Piezas</td>
        </tr>
        <tr>
          <td>#TK-1047</td>
          <td>Soacha</td>
          <td>Hardware</td>
          <td>Solucionado</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
